 <!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galeria Rosa</title>
    <style>
        :root {
            --primary-pink: #ff6584;
            --light-pink: #ffe6eb;
            --dark-pink: #d84a6b;
            --bg-color: #fff5f7;
            --text-color: #4a4a4a;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
        }

        h1 {
            color: var(--dark-pink);
            margin-bottom: 5px;
        }

        p {
            color: #777;
        }

        .card {
            background: #ffffff;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(255, 101, 132, 0.15);
            width: 100%;
            max-width: 500px;
            margin-bottom: 30px;
            border: 2px solid var(--light-pink);
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: var(--dark-pink);
        }

        input[type="text"],
        input[type="file"] {
            width: 100%;
            padding: 10px;
            border: 2px solid var(--light-pink);
            border-radius: 8px;
            box-sizing: border-box;
            outline: none;
            transition: border-color 0.3s;
        }

        input[type="text"]:focus,
        input[type="file"]:focus {
            border-color: var(--primary-pink);
        }

        button {
            background-color: var(--primary-pink);
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            font-size: 16px;
            font-weight: bold;
            transition: background-color 0.3s, transform 0.1s;
        }

        button:hover {
            background-color: var(--dark-pink);
        }

        button:active {
            transform: scale(0.98);
        }

        .gallery-container {
            width: 100%;
            max-width: 800px;
        }

        .gallery-title {
            color: var(--dark-pink);
            border-bottom: 2px solid var(--light-pink);
            padding-bottom: 10px;
            margin-bottom: 20px;
        }

        #gallery {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 20px;
        }

        .gallery-item {
            background: white;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.08);
            border: 1px solid var(--light-pink);
            display: flex;
            flex-direction: column;
        }

        .gallery-item img {
            width: 100%;
            height: 180px;
            object-fit: cover;
        }

        .gallery-info {
            padding: 12px;
            background-color: #fff;
            border-top: 1px solid var(--light-pink);
        }

        .gallery-info span {
            font-size: 14px;
            color: var(--dark-pink);
            font-weight: bold;
        }
    </style>
</head>
<body>

    <header>
        <h1>Minha Galeria Rosa</h1>
        <p>Compartilhe suas imagens com seu nome de usuário!</p>
    </header>

    <div class="card">
        <div class="form-group">
            <label for="username">Nome de Usuário:</label>
            <input type="text" id="nome" placeholder="Digite seu nome...">
        </div>

        <div class="form-group">
            <label for="imageFile">Escolha uma Imagem:</label>
            <input type="file" id="imageFile" accept="image/*">
        </div>

        <button onclick="addImage()" id="btn">Adicionar à Galeria</button>
    </div>

    <div class="gallery-container">
        <h3 class="gallery-title">Galeria de Publicações</h3>
        <div id="gallery">
            
        </div>
    </div>

    <script src="./script.js"></script>

</body>
</html>
